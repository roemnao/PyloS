<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý Bot Zalo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <h1>Quản lý Bot Zalo</h1>
      <p class="muted">Nhập mã truy cập (<code>ADMIN_TOKEN</code> trong file <code>.env</code>).</p>
      <input id="login-token" type="password" autocomplete="current-password" placeholder="Mã truy cập" required>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn primary">Đăng nhập</button>
    </form>
  </section>

  <div id="app" class="layout" hidden>
    <header class="topbar">
      <div class="brand">Bot Zalo</div>
      <span id="status-pill" class="pill">…</span>
      <button id="logout" class="btn ghost small" type="button">Đăng xuất</button>
    </header>
    <nav id="nav" class="nav" aria-label="Các trang"></nav>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
