# Source of truth for atlas.md (same folder).
# Edit this file, then run: python -m pylos.lobby.atlas.generator.atlas   (check only: add --check)
#
# status:
#   agreed      owner agreed (Q&A rounds 1-2)
#   proposed    suggested by Claude, owner has not reviewed yet
#   correction  differs from what the owner agreed; the note says why
#   open        not decided; the note lists the candidates
#
# [[file]] target:
#   <zone>/<building>[/<apartment>]   a place in the city ("<...>" apartments are per person / per bot)
#   outside/<area>                    stays outside the citadel
#   open                              undecided

# ---------------------------------------------------------------- the city

[[zone]]
name = "management"
vi = "Khu quản lý"
purpose = "Guidance, build plans, project management."

[[zone.building]]
name = "owner"
vi = "Toà Owner"
purpose = "The owner's own tools and notes. Bots may not enter."
apartments = [
  { name = "admin_web", status = "agreed", purpose = "admin web UI" },
  { name = "owner_log", status = "agreed", purpose = "what the owner did" },
  { name = "private_plans", status = "agreed", purpose = "plans and notes only the owner sees" },
  { name = "history", status = "proposed", purpose = "dated snapshots: plans, Q&A rounds, maps (data only, e.g. 5-11-2026/)" },
  { name = "secrets", status = "open", purpose = "secrets/tokens, or only a description of where they live (round 3 A7)" },
]

[[zone.building]]
name = "managers"
vi = "Toà quản lý"
purpose = "What manager bots read to manage other bots."
apartments = [
  { name = "guidelines", status = "agreed", purpose = "principles for manager bots" },
  { name = "bot_commands", status = "agreed", purpose = "commands that act on bots" },
  { name = "plans", status = "agreed", purpose = "public plans" },
  { name = "evaluations", status = "agreed", purpose = "weekly bot scores" },
  { name = "reports", status = "agreed", purpose = "reports" },
  { name = "bot_list", status = "agreed", purpose = "list of bots and their on/off switch" },
]

[[zone]]
name = "gate"
vi = "Khu cổng"
purpose = "Receives data from Zalo and outer-city bots; sends data out."

[[zone.building]]
name = "main_gate"
vi = "Cổng chính"
purpose = "Connections to the outer city, sessions, outside logs."
apartments = [
  { name = "zalo", status = "agreed", purpose = "personal account, Bot Platform, QR login, polling, webhook" },
  { name = "external_apps", status = "agreed", purpose = "third-party apps and APIs" },
  { name = "external_bots", status = "agreed", purpose = "bots outside PyloS" },
  { name = "sessions", status = "agreed", purpose = "sessions between bots and the outside" },
  { name = "logs", status = "agreed", purpose = "logs of outside traffic" },
]

[[zone.building]]
name = "fence"
vi = "Hàng rào"
purpose = "Limits, inbound and outbound: the rules and the code that enforces them."
apartments = [
  { name = "token_limit", status = "agreed", purpose = "token limit (whole system, per month) and rate limits" },
  { name = "speech_limit", status = "agreed", purpose = "what may be said / what is a request to the bot" },
  { name = "ethics", status = "agreed", purpose = "ethics rules" },
]

[[zone.building]]
name = "side_gate"
vi = "Cổng phụ"
purpose = "Technical entry: receives commands from the owner, the VPS and MCP."
apartments = [
  { name = "vps", status = "agreed", purpose = "VPS connection and control" },
  { name = "cron", status = "open", purpose = "schedule definitions; may move to dispatch (round 3 A2)" },
  { name = "mcp", status = "agreed", purpose = "MCP connections" },
  { name = "owner_commands", status = "agreed", purpose = "commands only the owner may run" },
  { name = "shell", status = "agreed", purpose = "cmd/shell commands" },
  { name = "emergency", status = "agreed", purpose = "emergency requests from the main gate" },
  { name = "desktop", status = "agreed", purpose = "Windows desktop app (window + tray)" },
]

[[zone.building]]
name = "guest_house"
vi = "Toà khách"
purpose = "One hut per person or Zalo group: their repos, connections, schedule, profile, files."
apartments = [
  { name = "<hut_id>", status = "agreed", purpose = "a hut, named by Zalo uid or group id; created on the first message" },
]

[[zone]]
name = "lobby"
vi = "Khu đại sảnh"
purpose = "Connects bots, the gate and the zones. Every flow between zones passes through here."

[[zone.building]]
name = "library"
vi = "Toà thư viện"
purpose = "Knowledge and skills written or vetted by the owner. All bots read."
apartments = [
  { name = "skills", status = "proposed", purpose = "skills (may carry scripts)" },
  { name = "knowledge", status = "proposed", purpose = "documents, guides" },
]

[[zone.building]]
name = "atlas"
vi = "Toà bản đồ"
purpose = "Map of the whole inner city: detailed map (graphify graph) + zoning (this file). Manager bot and owner keep it right."
apartments = [
  { name = "maps", status = "proposed", purpose = "city description, zoning, the generated atlas, the graphify graph" },
  { name = "generator", status = "proposed", purpose = "atlas script: render, check, look at one region over the graph" },
]

[[zone.building]]
name = "dispatch"
vi = "Toà điều phối"
purpose = "Core of PyloS: bus, clock, registry, queue, permissions, scheduling. Owner only."
apartments = [
  { name = "bus", status = "agreed", purpose = "message bus / router between zones" },
  { name = "clock", status = "agreed", purpose = "shared clock (Vietnam time)" },
  { name = "registry", status = "agreed", purpose = "which bots exist, which are running or asleep" },
  { name = "queue", status = "agreed", purpose = "job queue" },
  { name = "envelope_log", status = "agreed", purpose = "log of envelopes (never message content)" },
  { name = "permissions", status = "agreed", purpose = "roles of each bot and each person" },
  { name = "scheduler", status = "agreed", purpose = "runs scheduled jobs" },
  { name = "lifecycle", status = "open", purpose = "start/stop, single-instance lock; split with side_gate is round 3 A1" },
  { name = "handover", status = "agreed", purpose = "moving the bot between this machine and the VPS" },
  { name = "updater", status = "agreed", purpose = "self-update from git" },
  { name = "shared", status = "proposed", purpose = "code every zone uses (config, data paths, file formats)" },
]

[[zone.building]]
name = "office"
vi = "Toà văn phòng"
purpose = "Plugins and agent tools, plus the warehouse for generated files. Only the owner adds plugins."
apartments = [
  { name = "drawing", status = "agreed", purpose = "drawing plugin" },
  { name = "documents", status = "agreed", purpose = "docx / text presentation plugins" },
  { name = "code", status = "agreed", purpose = "code plugin" },
  { name = "agent_tools", status = "agreed", purpose = "tools the agent can call" },
  { name = "warehouse", status = "agreed", purpose = "generated files, stored by type" },
]

[[zone]]
name = "residential"
vi = "Khu dân cư"
purpose = "Where bots live."

[[zone.building]]
name = "residents"
vi = "Toà nhà dân"
purpose = "One apartment per bot: workspace, persona, bookshelf, memory. Only that bot and the owner enter."
apartments = [
  { name = "<bot_name>", status = "agreed", purpose = "workspace/ persona/ bookshelf/ memory/{muscle,short_term,long_term,archive}/" },
]

# ---------------------------------------------------------------- where every file goes

# Entry point and wiring
[[file]]
pattern = "src/bot/__init__.py"
target = "open"
status = "open"
note = "Stays as the thin `bot` entry package if round 3 C1 keeps `python -m bot run`."

[[file]]
pattern = "src/bot/__main__.py"
target = "open"
status = "open"
note = "`python -m bot` entry used by the VPS systemd unit and ZaloBot.cmd; must keep working (round 3 C1)."

[[file]]
pattern = "src/bot/command_line.py"
target = "open"
status = "open"
note = "CLI (run, gui, admin...). Candidates: stay in the `bot` entry package, or side_gate/owner_commands."

# main_gate

# fence

# side_gate

# guest_house

# lobby

[[file]]
pattern = "src/bot/core/vietnam_time.py"
target = "lobby/dispatch/clock"
status = "agreed"
note = "Compat only: user-written tools still `from bot.core.vietnam_time import now_vn`. Real code: lobby/dispatch/clock."

[[file]]
pattern = "src/bot/core/__init__.py"
target = "lobby/dispatch/clock"
status = "agreed"
note = "Compat package marker (see src/bot/core/vietnam_time.py)."

# residential

[[file]]
pattern = "src/bot/agent/__init__.py"
target = "lobby/office/agent_tools"
status = "agreed"
note = "Compat package marker (see src/bot/agent/tools.py)."

# management

[[file]]
pattern = "PyloS-*.md"
target = "management/owner/private_plans"
status = "proposed"
optional = true
note = "Owner Q&A rounds and the migration plan (Vietnamese working copies)."

