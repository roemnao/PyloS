[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zalo-assistant-bot"
version = "0.1.0"
description = "Bot trợ lý Zalo (Zalo Bot Platform) dùng Gemini"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
# Chạy trên acc Zalo cá nhân (RECEIVE_MODE=personal): thư viện không chính thức
personal = [
    "zlapi>=1.0.3",
]
# Ứng dụng quản lý (cửa sổ + khay): python -m bot gui
desktop = [
    "pywebview>=5",
    "pystray>=0.19",
    "pillow>=10.1",
]
# Đóng gói ZaloBot.exe: scripts/build-exe.ps1
build = [
    "pyinstaller>=6",
]

[project.scripts]
zalo-bot = "bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bot = ["admin/static/*", "templates/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
